name: inventory-engine
services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: inventory-engine-php:8.1
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  web:
    image: nginx:stable
    ports:
      - "7007:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
